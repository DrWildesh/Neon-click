<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Neon Reflex — Puzzle Clicker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#05060f;
    --bg-1:#0a0e1f;
    --neon-cyan:#00f6ff;
    --neon-pink:#ff2bd6;
    --neon-purple:#8b5cf6;
    --neon-gold:#ffd23f;
    --neon-red:#ff3b5c;
    --neon-green:#39ff9b;
    --panel:#0d1224;
    --panel-border:rgba(0,246,255,0.25);
    --text-dim:#8891b0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    height:100%;
    margin:0;
    background:
      radial-gradient(circle at 20% 10%, rgba(139,92,246,0.18), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(0,246,255,0.14), transparent 45%),
      var(--bg-0);
    font-family:'Rajdhani', sans-serif;
    color:#eaf0ff;
    overflow:hidden;
    touch-action:manipulation;
  }
  #app{
    display:flex;
    flex-direction:column;
    height:100%;
    max-width:520px;
    margin:0 auto;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    position:relative;
  }

  /* ---------- HEADER / HUD ---------- */
  header.hud{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    padding:10px 14px;
    background:linear-gradient(180deg, var(--panel), rgba(13,18,36,0.6));
    border:1px solid var(--panel-border);
    border-radius:16px;
    box-shadow:0 0 24px rgba(0,246,255,0.08), inset 0 0 20px rgba(0,0,0,0.4);
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .hud-block{ text-align:center; min-width:64px; }
  .hud-label{ font-size:10px; letter-spacing:2px; color:var(--text-dim); text-transform:uppercase; }
  .hud-value{
    font-family:'Orbitron', sans-serif;
    font-size:20px;
    font-weight:700;
  }
  #score-val{ color:var(--neon-cyan); text-shadow:0 0 10px var(--neon-cyan), 0 0 20px rgba(0,246,255,0.5); }
  #high-val{ color:var(--neon-gold); text-shadow:0 0 10px var(--neon-gold); }
  #level-val{ color:var(--neon-purple); text-shadow:0 0 10px var(--neon-purple); }
  #combo-val{ color:var(--neon-pink); text-shadow:0 0 10px var(--neon-pink); }

  .lives{ display:flex; gap:4px; justify-content:center; margin-top:2px; }
  .life-dot{
    width:10px; height:10px; border-radius:50%;
    background:var(--neon-red);
    box-shadow:0 0 8px var(--neon-red);
    transition:all .3s ease;
  }
  .life-dot.lost{ background:#222; box-shadow:none; transform:scale(0.6); opacity:.3; }

  /* ---------- AD BANNER PLACEHOLDER (TOP) ---------- */
  #ad-banner-container{
    width:100%;
    min-height:50px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:repeating-linear-gradient(45deg, #0c0f1c, #0c0f1c 10px, #10162b 10px, #10162b 20px);
    border:1px dashed rgba(255,255,255,0.15);
    border-radius:10px;
    color:var(--text-dim);
    font-size:11px;
    letter-spacing:1px;
    margin-bottom:10px;
    flex-shrink:0;
  }

  /* ---------- GAME GRID ---------- */
  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    min-height:0;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:10px;
    width:100%;
    max-width:440px;
    aspect-ratio:1/1;
  }
  .cell{
    position:relative;
    border-radius:16px;
    background:linear-gradient(145deg, #0e1326, #0a0e1d);
    border:1px solid rgba(255,255,255,0.06);
    box-shadow:inset 0 0 10px rgba(0,0,0,0.6);
    cursor:pointer;
    overflow:hidden;
    transition:transform .08s ease;
  }
  .cell:active{ transform:scale(0.94); }

  .cell.lit-normal{
    background:radial-gradient(circle, rgba(0,246,255,0.35), rgba(0,246,255,0.05));
    border:1px solid var(--neon-cyan);
    box-shadow:0 0 18px var(--neon-cyan), inset 0 0 20px rgba(0,246,255,0.4);
    animation:pulse-cyan .5s ease-in-out infinite alternate;
  }
  .cell.lit-gold{
    background:radial-gradient(circle, rgba(255,210,63,0.4), rgba(255,210,63,0.05));
    border:1px solid var(--neon-gold);
    box-shadow:0 0 22px var(--neon-gold), inset 0 0 22px rgba(255,210,63,0.45);
    animation:pulse-gold .35s ease-in-out infinite alternate;
  }
  .cell.lit-bomb{
    background:radial-gradient(circle, rgba(255,59,92,0.4), rgba(255,59,92,0.05));
    border:1px solid var(--neon-red);
    box-shadow:0 0 20px var(--neon-red), inset 0 0 20px rgba(255,59,92,0.4);
    animation:pulse-red .4s ease-in-out infinite alternate;
  }
  @keyframes pulse-cyan{ from{filter:brightness(1);} to{filter:brightness(1.35);} }
  @keyframes pulse-gold{ from{filter:brightness(1);} to{filter:brightness(1.45);} }
  @keyframes pulse-red{ from{filter:brightness(1);} to{filter:brightness(1.3);} }

  .cell .icon{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size:22px; opacity:0.9; pointer-events:none;
  }

  .cell-shrink{ animation:shrinkTimeout linear forwards; }
  .cell-shrink::after{
    content:'';
    position:absolute; left:0; bottom:0; height:3px; width:100%;
    background:currentColor;
  }

  /* floating score popup */
  .pop{
    position:absolute;
    font-family:'Orbitron', sans-serif;
    font-weight:700;
    font-size:18px;
    pointer-events:none;
    animation:floatUp .7s ease-out forwards;
    z-index:20;
  }
  @keyframes floatUp{
    0%{ transform:translateY(0) scale(0.6); opacity:1; }
    100%{ transform:translateY(-60px) scale(1.3); opacity:0; }
  }

  /* particle burst */
  .particle{
    position:absolute;
    width:6px; height:6px;
    border-radius:50%;
    pointer-events:none;
    z-index:19;
    animation:particleOut .5s ease-out forwards;
  }
  @keyframes particleOut{
    to{ transform:translate(var(--dx), var(--dy)) scale(0); opacity:0; }
  }

  /* ---------- OVERLAYS ---------- */
  .overlay{
    position:absolute; inset:0;
    background:rgba(4,6,16,0.92);
    backdrop-filter:blur(6px);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; text-align:center; padding:24px;
    z-index:50;
    border-radius:20px;
  }
  .overlay.hidden{ display:none; }
  .title-glow{
    font-family:'Orbitron', sans-serif;
    font-size:34px;
    font-weight:900;
    letter-spacing:3px;
    background:linear-gradient(90deg, var(--neon-cyan), var(--neon-pink), var(--neon-purple));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 18px rgba(0,246,255,0.5));
    animation:hueShift 4s linear infinite;
  }
  @keyframes hueShift{ 0%{filter:hue-rotate(0deg) drop-shadow(0 0 18px rgba(0,246,255,0.5));} 100%{filter:hue-rotate(360deg) drop-shadow(0 0 18px rgba(0,246,255,0.5));} }

  .sub{ color:var(--text-dim); font-size:14px; max-width:300px; line-height:1.5; }

  .btn{
    font-family:'Orbitron', sans-serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:1px;
    padding:14px 28px;
    border-radius:50px;
    border:1px solid var(--neon-cyan);
    background:rgba(0,246,255,0.08);
    color:var(--neon-cyan);
    box-shadow:0 0 16px rgba(0,246,255,0.35);
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:active{ transform:scale(0.95); }
  .btn.secondary{
    border-color:var(--neon-purple);
    color:var(--neon-purple);
    background:rgba(139,92,246,0.08);
    box-shadow:0 0 16px rgba(139,92,246,0.3);
  }
  .btn.gold{
    border-color:var(--neon-gold);
    color:var(--neon-gold);
    background:rgba(255,210,63,0.08);
    box-shadow:0 0 16px rgba(255,210,63,0.35);
  }

  .final-score{
    font-family:'Orbitron', sans-serif;
    font-size:46px;
    font-weight:900;
    color:var(--neon-cyan);
    text-shadow:0 0 20px var(--neon-cyan);
  }
  .new-high{
    color:var(--neon-gold);
    font-size:13px;
    letter-spacing:2px;
    animation:blink 1s ease-in-out infinite;
  }
  @keyframes blink{ 50%{opacity:0.3;} }

  #pause-btn{
    position:absolute; top:10px; right:10px;
    width:38px; height:38px;
    border-radius:50%;
    background:rgba(13,18,36,0.8);
    border:1px solid var(--panel-border);
    color:var(--text-dim);
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
    z-index:40;
    cursor:pointer;
  }
</style>
</head>
<body>
<div id="app">

  <header class="hud">
    <div class="hud-block">
      <div class="hud-label">Score</div>
      <div class="hud-value" id="score-val">0</div>
    </div>
    <div class="hud-block">
      <div class="hud-label">Best</div>
      <div class="hud-value" id="high-val">0</div>
    </div>
    <div class="hud-block">
      <div class="hud-label">Level</div>
      <div class="hud-value" id="level-val">1</div>
    </div>
    <div class="hud-block">
      <div class="hud-label">Combo</div>
      <div class="hud-value" id="combo-val">x1</div>
    </div>
    <div class="hud-block">
      <div class="hud-label">Lives</div>
      <div class="lives" id="lives-row"></div>
    </div>
  </header>

  <!-- =====================================================
       ADMOB BANNER PLACEHOLDER
       Paste your AdMob Banner Ad code integration here.
       In an Android WebView wrapper, replace this div's
       content by calling into your native bridge, e.g.:
         AndroidAds.showBanner("ca-app-pub-xxxx/yyyy");
       For a pure web/PWA build using Google Publisher Tags
       or AdSense for a WebView shell, inject the ad script
       here instead of this placeholder text.
       ===================================================== -->
  <div id="ad-banner-container">[ AdMob Banner Placeholder — 320x50 ]</div>

  <main>
    <div id="grid"></div>

    <!-- START SCREEN -->
    <div class="overlay" id="start-screen">
      <div class="title-glow">NEON REFLEX</div>
      <div class="sub">Tap the glowing cyan tiles before they fade. Grab GOLD for bonus points. Avoid RED bombs. Survive, combo, climb the levels.</div>
      <button class="btn" id="start-btn">▶ START GAME</button>
      <div class="sub" style="font-size:12px;">Best Score: <span id="start-high">0</span></div>
    </div>

    <!-- GAME OVER SCREEN -->
    <div class="overlay hidden" id="gameover-screen">
      <div class="title-glow" style="font-size:26px;">GAME OVER</div>
      <div class="final-score" id="final-score">0</div>
      <div class="new-high hidden" id="new-high-badge">🏆 NEW HIGH SCORE</div>

      <!-- =====================================================
           ADMOB REWARDED / INTERSTITIAL PLACEHOLDER (CONTINUE)
           Optional: show a rewarded ad here to let the player
           revive with 1 life instead of restarting.
             function onWatchAdToContinue(){
               // AndroidAds.showRewarded(); -> on reward callback,
               // call reviveGame() from the native bridge.
             }
           ===================================================== -->
      <button class="btn gold" id="revive-btn">🎬 WATCH AD TO CONTINUE</button>

      <button class="btn" id="restart-btn">↻ PLAY AGAIN</button>
    </div>

    <!-- PAUSE SCREEN -->
    <div class="overlay hidden" id="pause-screen">
      <div class="title-glow" style="font-size:26px;">PAUSED</div>
      <button class="btn" id="resume-btn">▶ RESUME</button>
      <button class="btn secondary" id="quit-btn">⏹ QUIT TO MENU</button>
    </div>

    <button id="pause-btn">⏸</button>
  </main>

  <!-- =====================================================
       ADMOB BANNER PLACEHOLDER (BOTTOM, OPTIONAL)
       Some layouts prefer a bottom-anchored banner instead.
       Duplicate/adjust the top placeholder logic here if
       your ad unit should live at the bottom of the screen.
       ===================================================== -->
  <div id="ad-banner-container-bottom" style="display:none;"></div>

</div>

<script>
(function(){
  'use strict';

  /* =====================================================================
     ADMOB INTEGRATION LAYER (PLACEHOLDER)
     ---------------------------------------------------------------------
     Drop your real AdMob logic into these functions. They are already
     wired into the correct game events below, so once you fill them in
     (typically by calling out to a native Android bridge injected into
     the WebView, e.g. `window.AndroidAds`), ads will trigger automatically
     at the right moments without touching any other game code.
  ===================================================================== */
  const AdManager = {
    // Call once when the app/page loads.
    initBannerAd(){
      // TODO: Paste AdMob Banner init code here.
      // Example (Android WebView JS bridge):
      // if (window.AndroidAds) window.AndroidAds.loadBanner("ca-app-pub-XXXXXXXX/BANNER_UNIT_ID");
      console.log('[AdManager] initBannerAd() placeholder — wire up AdMob banner here.');
    },

    // Call to preload an interstitial before you need to show it.
    preloadInterstitial(){
      // TODO: Paste AdMob Interstitial preload code here.
      // Example:
      // if (window.AndroidAds) window.AndroidAds.loadInterstitial("ca-app-pub-XXXXXXXX/INTERSTITIAL_UNIT_ID");
      console.log('[AdManager] preloadInterstitial() placeholder.');
    },

    // Called automatically on Game Over (every N game-overs, see GAME_OVER_AD_FREQUENCY).
    showInterstitial(onClosed){
      // TODO: Paste AdMob Interstitial show code here.
      // Example:
      // if (window.AndroidAds) {
      //   window.AndroidAds.showInterstitial();
      //   window.onInterstitialClosed = onClosed; // native calls this back
      //   return;
      // }
      console.log('[AdManager] showInterstitial() placeholder — showing nothing, continuing immediately.');
      if (typeof onClosed === 'function') onClosed();
    },

    // Called when player taps "Watch Ad to Continue" on Game Over.
    showRewardedAd(onReward, onFail){
      // TODO: Paste AdMob Rewarded Ad code here.
      // Example:
      // if (window.AndroidAds) {
      //   window.AndroidAds.showRewarded();
      //   window.onRewardedEarned = onReward;
      //   window.onRewardedFailed = onFail;
      //   return;
      // }
      console.log('[AdManager] showRewardedAd() placeholder — no ad SDK connected, simulating success.');
      if (typeof onReward === 'function') onReward(); // remove this line once real SDK is wired up
    }
  };

  // How many game-overs between forced interstitials (typical AdMob best practice: not every single one).
  const GAME_OVER_AD_FREQUENCY = 3;
  let gameOverCount = 0;

  // Kick off banner + preload interstitial as soon as the game boots.
  AdManager.initBannerAd();
  AdManager.preloadInterstitial();


  /* =====================================================================
     GAME CONFIG & STATE
  ===================================================================== */
  const GRID_SIZE = 16; // 4x4
  const STORAGE_KEY = 'neonReflex_highScore';
  const START_LIVES = 3;

  const grid = document.getElementById('grid');
  const scoreVal = document.getElementById('score-val');
  const highVal = document.getElementById('high-val');
  const levelVal = document.getElementById('level-val');
  const comboVal = document.getElementById('combo-val');
  const livesRow = document.getElementById('lives-row');

  const startScreen = document.getElementById('start-screen');
  const gameoverScreen = document.getElementById('gameover-screen');
  const pauseScreen = document.getElementById('pause-screen');
  const finalScoreEl = document.getElementById('final-score');
  const newHighBadge = document.getElementById('new-high-badge');
  const startHighEl = document.getElementById('start-high');

  let state = {
    score: 0,
    highScore: parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10),
    level: 1,
    combo: 0,
    lives: START_LIVES,
    running: false,
    paused: false,
    spawnTimer: null,
    activeCells: new Map(), // index -> {type, timeoutId}
    correctInLevel: 0
  };

  // Build the grid cells once.
  for(let i=0;i<GRID_SIZE;i++){
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.index = i;
    cell.addEventListener('pointerdown', onCellTap, {passive:true});
    grid.appendChild(cell);
  }

  highVal.textContent = state.highScore;
  startHighEl.textContent = state.highScore;

  /* =====================================================================
     CORE GAME LOOP
  ===================================================================== */
  function startGame(){
    state.score = 0;
    state.level = 1;
    state.combo = 0;
    state.lives = START_LIVES;
    state.correctInLevel = 0;
    state.running = true;
    state.paused = false;
    state.activeCells.forEach(v => clearTimeout(v.timeoutId));
    state.activeCells.clear();

    renderHUD();
    renderLives();
    clearAllCells();

    startScreen.classList.add('hidden');
    gameoverScreen.classList.add('hidden');
    pauseScreen.classList.add('hidden');

    scheduleSpawn();
  }

  function scheduleSpawn(){
    if(!state.running || state.paused) return;
    const interval = getSpawnInterval();
    state.spawnTimer = setTimeout(() => {
      spawnTarget();
      scheduleSpawn();
    }, interval);
  }

  function getSpawnInterval(){
    // Gets faster as level increases, floors out for playability.
    const base = 950;
    const reduction = (state.level - 1) * 55;
    return Math.max(340, base - reduction);
  }

  function getLiveDuration(){
    const base = 1350;
    const reduction = (state.level - 1) * 45;
    return Math.max(520, base - reduction);
  }

  function spawnTarget(){
    const freeCells = [];
    grid.querySelectorAll('.cell').forEach(c => {
      if(!state.activeCells.has(parseInt(c.dataset.index))) freeCells.push(c);
    });
    if(freeCells.length === 0) return;

    const cell = freeCells[Math.floor(Math.random() * freeCells.length)];
    const idx = parseInt(cell.dataset.index);

    // Weighted random type: mostly normal, some gold, some bomb (bomb chance grows slightly with level).
    const roll = Math.random();
    let type = 'normal';
    if(roll > 0.90) type = 'gold';
    else if(roll > 0.78 && state.level > 1) type = 'bomb';

    cell.classList.add(type === 'normal' ? 'lit-normal' : type === 'gold' ? 'lit-gold' : 'lit-bomb');
    cell.innerHTML = `<div class="icon">${type === 'normal' ? '◆' : type === 'gold' ? '★' : '☠'}</div>`;

    const duration = getLiveDuration();
    cell.style.color = type === 'normal' ? 'var(--neon-cyan)' : type === 'gold' ? 'var(--neon-gold)' : 'var(--neon-red)';

    const timeoutId = setTimeout(() => {
      // Target expired.
      if(type === 'normal') handleMiss(cell, idx);
      else if(type === 'gold') { clearCell(cell, idx); } // gold missed = no penalty, just gone
      else { clearCell(cell, idx); } // bomb expiring safely is fine, no penalty
    }, duration);

    state.activeCells.set(idx, {type, timeoutId});
  }

  function onCellTap(e){
    if(!state.running || state.paused) return;
    const cell = e.currentTarget;
    const idx = parseInt(cell.dataset.index);
    const data = state.activeCells.get(idx);

    if(!data){
      // Tapped an unlit cell — no penalty, keeps game forgiving/addictive.
      return;
    }

    if(data.type === 'bomb'){
      handleBombHit(cell, idx);
    } else {
      handleCorrectHit(cell, idx, data.type, e);
    }
  }

  function handleCorrectHit(cell, idx, type, e){
    clearTimeout(state.activeCells.get(idx).timeoutId);
    state.activeCells.delete(idx);

    state.combo += 1;
    const comboMultiplier = 1 + Math.floor(state.combo / 5) * 0.5; // grows every 5-combo
    const basePoints = type === 'gold' ? 30 : 10;
    const gained = Math.round(basePoints * comboMultiplier);
    state.score += gained;
    state.correctInLevel += 1;

    spawnPopup(cell, `+${gained}`, type === 'gold' ? 'var(--neon-gold)' : 'var(--neon-cyan)');
    spawnParticles(cell, type === 'gold' ? 'var(--neon-gold)' : 'var(--neon-cyan)');

    clearCell(cell, idx);
    maybeLevelUp();
    renderHUD();
  }

  function handleMiss(cell, idx){
    state.activeCells.delete(idx);
    state.combo = 0;
    clearCell(cell, idx);
    renderHUD();
    loseLife();
  }

  function handleBombHit(cell, idx){
    clearTimeout(state.activeCells.get(idx).timeoutId);
    state.activeCells.delete(idx);
    state.combo = 0;
    spawnPopup(cell, 'BOOM', 'var(--neon-red)');
    spawnParticles(cell, 'var(--neon-red)');
    clearCell(cell, idx);
    renderHUD();
    loseLife();
  }

  function loseLife(){
    state.lives -= 1;
    renderLives();
    if(state.lives <= 0){
      endGame();
    }
  }

  function maybeLevelUp(){
    const needed = 8 + (state.level - 1) * 2;
    if(state.correctInLevel >= needed){
      state.level += 1;
      state.correctInLevel = 0;
    }
  }

  function clearCell(cell, idx){
    cell.className = 'cell';
    cell.innerHTML = '';
    cell.style.color = '';
  }

  function clearAllCells(){
    grid.querySelectorAll('.cell').forEach(c => { c.className = 'cell'; c.innerHTML=''; });
  }

  function endGame(){
    state.running = false;
    clearTimeout(state.spawnTimer);
    state.activeCells.forEach(v => clearTimeout(v.timeoutId));
    state.activeCells.clear();

    const isNewHigh = state.score > state.highScore;
    if(isNewHigh){
      state.highScore = state.score;
      localStorage.setItem(STORAGE_KEY, String(state.highScore));
    }

    finalScoreEl.textContent = state.score;
    newHighBadge.classList.toggle('hidden', !isNewHigh);
    highVal.textContent = state.highScore;
    startHighEl.textContent = state.highScore;

    gameoverScreen.classList.remove('hidden');

    // ---- AdMob interstitial hook: shown periodically on Game Over ----
    gameOverCount += 1;
    if(gameOverCount % GAME_OVER_AD_FREQUENCY === 0){
      AdManager.showInterstitial(() => {
        AdManager.preloadInterstitial(); // preload the next one
      });
    } else {
      AdManager.preloadInterstitial();
    }
  }

  function reviveGame(){
    state.lives = 1;
    state.running = true;
    state.paused = false;
    gameoverScreen.classList.add('hidden');
    renderLives();
    scheduleSpawn();
  }

  /* =====================================================================
     RENDERING HELPERS
  ===================================================================== */
  function renderHUD(){
    scoreVal.textContent = state.score;
    levelVal.textContent = state.level;
    const mult = 1 + Math.floor(state.combo / 5) * 0.5;
    comboVal.textContent = 'x' + mult.toFixed(1).replace('.0','');
  }

  function renderLives(){
    livesRow.innerHTML = '';
    for(let i=0;i<START_LIVES;i++){
      const dot = document.createElement('div');
      dot.className = 'life-dot' + (i >= state.lives ? ' lost' : '');
      livesRow.appendChild(dot);
    }
  }

  function spawnPopup(cell, text, color){
    const rect = cell.getBoundingClientRect();
    const appRect = document.getElementById('app').getBoundingClientRect();
    const pop = document.createElement('div');
    pop.className = 'pop';
    pop.textContent = text;
    pop.style.color = color;
    pop.style.left = (rect.left - appRect.left + rect.width/2 - 20) + 'px';
    pop.style.top = (rect.top - appRect.top + rect.height/2 - 10) + 'px';
    document.getElementById('app').appendChild(pop);
    setTimeout(() => pop.remove(), 700);
  }

  function spawnParticles(cell, color){
    const rect = cell.getBoundingClientRect();
    const appRect = document.getElementById('app').getBoundingClientRect();
    const cx = rect.left - appRect.left + rect.width/2;
    const cy = rect.top - appRect.top + rect.height/2;
    for(let i=0;i<8;i++){
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.background = color;
      p.style.left = cx + 'px';
      p.style.top = cy + 'px';
      const angle = (Math.PI*2/8) * i;
      const dist = 40 + Math.random()*20;
      p.style.setProperty('--dx', Math.cos(angle)*dist + 'px');
      p.style.setProperty('--dy', Math.sin(angle)*dist + 'px');
      document.getElementById('app').appendChild(p);
      setTimeout(() => p.remove(), 500);
    }
  }

  /* =====================================================================
     PAUSE / RESUME / QUIT
  ===================================================================== */
  function pauseGame(){
    if(!state.running) return;
    state.paused = true;
    clearTimeout(state.spawnTimer);
    pauseScreen.classList.remove('hidden');
  }

  function resumeGame(){
    state.paused = false;
    pauseScreen.classList.add('hidden');
    scheduleSpawn();
  }

  function quitToMenu(){
    state.running = false;
    state.paused = false;
    clearTimeout(state.spawnTimer);
    state.activeCells.forEach(v => clearTimeout(v.timeoutId));
    state.activeCells.clear();
    clearAllCells();
    pauseScreen.classList.add('hidden');
    gameoverScreen.classList.add('hidden');
    startScreen.classList.remove('hidden');
  }

  /* =====================================================================
     EVENT WIRING
  ===================================================================== */
  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('restart-btn').addEventListener('click', startGame);
  document.getElementById('pause-btn').addEventListener('click', pauseGame);
  document.getElementById('resume-btn').addEventListener('click', resumeGame);
  document.getElementById('quit-btn').addEventListener('click', quitToMenu);

  document.getElementById('revive-btn').addEventListener('click', () => {
    AdManager.showRewardedAd(
      () => reviveGame(),                 // onReward
      () => console.log('Ad failed/skipped, no revive granted.') // onFail
    );
  });

})();
</script>

<script src="cordova.js"></script>
    <script>
    // Ensure the AdManager object exists safely before expanding it
    if (typeof AdManager !== 'undefined') {
        AdManager.interstitial = null;
        AdManager.rewarded = null;

        AdManager.initBannerAd = function() {
            document.addEventListener('deviceready', async () => {
                try {
                    await admob.start();
                    const banner = new admob.BannerAd({
                        adUnitId: 'ca-app-pub-3940256099942544/6300978111',
                        position: 'bottom'
                    });
                    await banner.load();
                    await banner.show();
                } catch (err) { console.error(err); }
            }, false);
        };

        AdManager.preloadInterstitial = function() {
            document.addEventListener('deviceready', async () => {
                try {
                    this.interstitial = new admob.InterstitialAd({ adUnitId: 'ca-app-pub-3940256099942544/1033173712' });
                    await this.interstitial.load();
                } catch (err) { console.error(err); }
            }, false);
        };

        AdManager.showInterstitial = async function() {
            if (this.interstitial) { try { await this.interstitial.show(); this.preloadInterstitial(); } catch (err) { console.error(err); } } else { this.preloadInterstitial(); }
        };

        AdManager.preloadRewarded = function() {
            document.addEventListener('deviceready', async () => {
                try {
                    this.rewarded = new admob.RewardedAd({ adUnitId: 'ca-app-pub-3940256099942544/5224354917' });
                    await this.rewarded.load();
                } catch (err) { console.error(err); }
            }, false);
        };

        AdManager.showRewarded = async function(onRewardEarnedCallback) {
            if (this.rewarded) {
                try {
                    document.addEventListener('admob.rewarded.reward', () => { if (typeof onRewardEarnedCallback === 'function') onRewardEarnedCallback(); });
                    await this.rewarded.show();
                    this.preloadRewarded();
                } catch (err) { console.error(err); }
            } else { this.preloadRewarded(); }
        };

        AdManager.initBannerAd();
        AdManager.preloadInterstitial();
        AdManager.preloadRewarded();
    }
    </script>
